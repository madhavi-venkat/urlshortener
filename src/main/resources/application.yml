spring:
  application:
    name: url-shortener

  datasource:
    url: jdbc:postgresql://localhost:5432/urlshortener
    username: urlshortener
    password: urlshortener

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate auto-DDL.
      # 'validate' fails fast if the entity and the migrated schema drift apart.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

# Base URL used to construct the returned short link (e.g. http://localhost:8080/{code}).
app:
  base-url: http://localhost:8080
  # Length of generated random codes (custom aliases may differ).
  code-length: 7

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # No component details on the public /actuator/health — the app has no auth
      # layer yet, and DB/Redis internals (host, driver) shouldn't be exposed
      # unauthenticated. Flip to "when-authorized" once auth exists.
      show-details: never
      probes:
        enabled: true
      group:
        # Liveness = "is the JVM alive/not deadlocked" only. Must NOT depend on
        # Postgres/Redis — a dependency outage should never cause Kubernetes to
        # restart otherwise-healthy pods.
        liveness:
          include: livenessState
        # Readiness = "can this instance actually serve traffic". Postgres is the
        # source of truth, so it gates readiness. Redis deliberately does NOT:
        # ShortUrlCache is designed to degrade to Postgres-only on a Redis outage
        # (see ShortUrlCache javadoc), so a Redis blip must not pull instances out
        # of the load-balancer rotation when the app is still fully correct.
        readiness:
          include: readinessState, db
